pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'galaxy'

// One Gradle project per mod. Add new mods here.
include 'core'
include 'gravity'
include 'worldgen'
include 'ship'

project(':core').projectDir = file('mods/core')
project(':gravity').projectDir = file('mods/gravity')
project(':worldgen').projectDir = file('mods/worldgen')
project(':ship').projectDir = file('mods/ship')
